<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Grid Layout</title>

		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<header>Teste</header>
		<main>
			<section></section>
			<section class="product-section">
				<h2>Produtos</h2>
				<div class="product-grid">
                    <div class="product-grid-item">
                        <img class="product-item-img" src="https://via.placeholder.com/150" alt="Imagem do produto">
                        <h3 class="product-item-title">Produto 1</h3>
                        <div class="product-item-info">
                            <h4 class="product-price">Preço: R$200</h4>
                            <p>Descrição do produto 1</p>
                        </div>
                        <button>Comprar</button>
                    </div>
				</div>
			</section>
		</main>
		<footer>Teste</footer>
	</body>
</html>
